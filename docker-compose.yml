services:
  db:
    image: postgis/postgis:16-3.4
    container_name: bahcelab-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bahcelab
      POSTGRES_PASSWORD: bahcelab
      POSTGRES_DB: bahcelab
    ports:
      - "5432:5432"
    volumes:
      - bahcelab_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bahcelab -d bahcelab"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Zamanlanmış işler için kuyruk/zamanlayıcı (ADR 0009): JOB_BACKEND=arq iken `make worker`
  redis:
    image: redis:7-alpine
    container_name: bahcelab-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  bahcelab_pgdata:
