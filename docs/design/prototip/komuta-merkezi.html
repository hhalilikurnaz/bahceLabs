<title>BahçeLab Komuta Merkezi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: üst gezinme + bahçe çubuğu; altında ikiye bölünmüş çalışma alanı — solda harita ve zaman şeridi, sağda sekmeli bahçe paneli. */
:root{
  --paper:#F6F5F0; --sheet:#FFFFFF; --ink:#17201B; --graphite:#58615A; --muted:#8B9189;
  --rule:#D9D6CC; --rule-soft:#ECEAE3; --lemon:#E5BC2F; --lemon-ink:#1A1A12; --lemon-soft:#FBF3D3;
  --brand:#1E4B35; --good:#2D6A4A; --watch:#9C7A12; --warn:#A24F1B; --water:#4A7491;
  --map-paper:#ECE9DE; --map-line:#CFC4AA; --map-sym:#C5BCA4; --glass:rgba(255,255,255,.94);
  --shadow:0 1px 0 rgba(23,32,27,.04),0 6px 24px -12px rgba(23,32,27,.25);
  --f-display:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-ui:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-data:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:8px;
}
/* Saha Defteri: ayrı sayfa, defter dili yalnız burada */
.notebook{--f-display:'Newsreader',Georgia,'Times New Roman',serif;--f-ui:'IBM Plex Sans',system-ui,sans-serif;--f-data:'IBM Plex Mono',ui-monospace,Menlo,monospace;--r:0px;font-family:var(--f-ui)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111512; --sheet:#181D19; --ink:#E9ECE6; --graphite:#A6AEA6; --muted:#7D857D;
  --rule:#323A34; --rule-soft:#232A25; --lemon:#E5BC2F; --lemon-ink:#1A1A12; --lemon-soft:#3A3416;
  --brand:#8CC3A2; --good:#7FC09A; --watch:#D7B24A; --warn:#E5915A; --water:#86AECB;
  --map-paper:#1E231F; --map-line:#3C453E; --map-sym:#3A433C; --glass:rgba(24,29,25,.94);
  --shadow:0 1px 0 rgba(0,0,0,.2),0 8px 28px -12px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111512; --sheet:#181D19; --ink:#E9ECE6; --graphite:#A6AEA6; --muted:#7D857D;
  --rule:#323A34; --rule-soft:#232A25; --lemon:#E5BC2F; --lemon-ink:#1A1A12; --lemon-soft:#3A3416;
  --brand:#8CC3A2; --good:#7FC09A; --watch:#D7B24A; --warn:#E5915A; --water:#86AECB;
  --map-paper:#1E231F; --map-line:#3C453E; --map-sym:#3A433C; --glass:rgba(24,29,25,.94);
  --shadow:0 1px 0 rgba(0,0,0,.2),0 8px 28px -12px rgba(0,0,0,.7); color-scheme:dark}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:400 14px/1.45 var(--f-ui);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--lemon);outline-offset:2px}
.mono{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.eyebrow{font:600 10.5px/1.2 var(--f-data);letter-spacing:.08em;text-transform:uppercase;color:var(--graphite)}
.app{height:100%;display:flex;flex-direction:column;min-height:640px}

/* Üst gezinme */
.topnav{display:flex;align-items:center;gap:20px;padding:0 20px;height:56px;background:var(--sheet);border-bottom:1px solid var(--rule);flex:0 0 auto}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font:600 16px var(--f-ui);letter-spacing:-.01em;white-space:nowrap}
.logo-mark{width:30px;height:30px;display:grid;place-items:center;background:var(--brand);border-radius:3px}
.primary{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0}
.primary button{border:0;background:none;padding:0 12px;height:56px;color:var(--graphite);font-weight:500;position:relative;white-space:nowrap;display:flex;align-items:center;gap:7px}
.primary button[aria-current="page"]{color:var(--ink)}
.primary button[aria-current="page"]::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:2px;background:var(--lemon)}
.primary button .soon{font:500 9.5px var(--f-data);color:var(--muted);border:1px solid var(--rule);padding:1px 4px;border-radius:2px}
.spacer{flex:1}
.cmdk{display:flex;align-items:center;gap:10px;height:36px;width:300px;max-width:32vw;padding:0 10px;border:1px solid var(--rule);background:var(--paper);border-radius:3px;color:var(--graphite);text-align:left}
.cmdk span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
kbd{font:500 10.5px var(--f-data);border:1px solid var(--rule);background:var(--sheet);padding:1px 5px;border-radius:2px;color:var(--graphite)}
.iconbtn{width:36px;height:36px;display:grid;place-items:center;border:1px solid transparent;background:none;border-radius:3px;position:relative;color:var(--ink)}
.iconbtn:hover{border-color:var(--rule)}
.badge{position:absolute;top:3px;right:3px;min-width:15px;height:15px;border-radius:8px;background:var(--warn);color:#fff;font:600 9.5px/15px var(--f-data);text-align:center;padding:0 3px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--rule-soft);display:grid;place-items:center;font:600 12px var(--f-ui)}

/* Bahçe çubuğu */
.gardenbar{display:flex;align-items:center;gap:18px;padding:0 20px;height:52px;border-bottom:1px solid var(--rule);background:var(--sheet);flex:0 0 auto;overflow-x:auto;scrollbar-width:none}
.gpick{display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;white-space:nowrap}
.gpick .name{font:700 19px/1 var(--f-display);letter-spacing:-.02em}
.gpick .meta{font-size:12px;color:var(--graphite)}
.tabs{display:flex;gap:2px;height:52px}
.tabs button{border:0;background:none;padding:0 12px;color:var(--graphite);font-weight:500;position:relative;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink)}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:3px;background:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;flex:0 0 auto}
.seg button{border:0;background:var(--sheet);padding:0 12px;height:32px;font-size:12.5px;font-weight:500;color:var(--graphite);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.notebook .seg{border-color:var(--ink)}
.seg.soft{border-color:var(--rule)}
.seg.soft button[aria-pressed="true"]{background:var(--rule-soft);color:var(--ink)}

/* Çalışma alanı */
.work{flex:1;display:flex;min-height:0}
.left{flex:1 1 66%;min-width:320px;display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--rule)}
.divider{flex:0 0 8px;cursor:col-resize;background:transparent;position:relative;margin:0 -4px;z-index:5;border:0;padding:0}
.divider::after{content:"";position:absolute;top:50%;left:50%;width:2px;height:36px;transform:translate(-50%,-50%);background:var(--rule);border-radius:1px}
.divider:hover::after,.divider:focus-visible::after{background:var(--lemon)}
.right{flex:1 1 34%;min-width:360px;max-width:560px;background:var(--sheet);overflow-y:auto;min-height:0}
.map{position:relative;flex:1;min-height:340px;overflow:hidden;background:var(--map-paper)}
.map canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
.ov{position:absolute;z-index:2}
.glass{background:var(--glass);border:1px solid var(--rule);border-radius:calc(var(--r) + 2px);box-shadow:var(--shadow);backdrop-filter:blur(6px)}
.karto .glass{border-color:var(--ink);box-shadow:none;border-radius:0}
.layerbar{top:14px;left:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;max-width:calc(100% - 28px)}
.layerbar .seg{border-color:var(--rule)}
.karto .layerbar .seg{border-color:var(--ink);border-radius:0}
.chip{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 10px;font-size:12.5px;font-weight:500}
.chip input[type=range]{width:86px;accent-color:var(--ink)}
.switch{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 10px;font-size:12.5px;font-weight:500;cursor:pointer;user-select:none}
.switch input{accent-color:var(--ink);width:15px;height:15px;margin:0}
.legend{left:14px;bottom:14px;width:286px;padding:12px 14px 10px}
.legend .hist{display:block;width:100%;height:64px}
.legend .row{display:flex;justify-content:space-between;font:400 11px var(--f-data);color:var(--graphite);margin-top:3px}
.inspect{width:244px;padding:12px 14px}
.inspect .v{font:600 28px/1 var(--f-data)}
.inspect .x{position:absolute;top:6px;right:6px}
.pin{border:1px solid var(--ink);background:var(--sheet);color:var(--ink);padding:6px 9px;font-size:12px;text-align:left;border-radius:0;transform:translate(14px,-50%);white-space:nowrap}
.pin b{font:600 12px var(--f-data);color:var(--warn)}
.pin::before{content:"";position:absolute;left:-15px;top:50%;width:14px;height:1px;background:var(--ink)}
.pindot{width:12px;height:12px;border-radius:50%;background:var(--sheet);border:2.5px solid var(--warn);transform:translate(-50%,-50%);pointer-events:none}
.yearbadge{top:62px;left:14px;padding:6px 8px 6px 12px;display:flex;align-items:center;gap:8px;font-size:12.5px}
.scale{right:14px;bottom:14px;padding:8px 10px;display:flex;align-items:flex-end;gap:14px}
.scale svg{display:block}
.timepill{right:14px;top:14px;display:flex;align-items:center;gap:4px;padding:4px}
.timepill .iconbtn{width:30px;height:30px;font-size:18px;line-height:1}
.timepill .iconbtn:disabled{opacity:.3;cursor:default}
.timepill .btn{height:30px;margin-left:4px}
.tp-t{display:flex;flex-direction:column;padding:0 6px;line-height:1.25;white-space:nowrap}
.tp-t b{font:600 13px var(--f-data)}
.tp-t span{font:400 10.5px var(--f-data);color:var(--graphite)}
.layerbar{max-width:calc(100% - 400px)!important}
.lp{position:relative}
.lp-btn{display:flex;align-items:center;gap:10px;height:40px;padding:0 12px 0 8px;color:var(--ink);text-align:left}
.lp-sw{display:block;width:30px;height:12px;border-radius:3px;flex:0 0 auto;border:1px solid rgba(0,0,0,.12)}
.lp-n{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.lp-n b{font-size:13px;font-weight:700} .lp-n b em{font:500 10.5px var(--f-data);color:var(--muted);font-style:normal;margin-left:4px}
.lp-n > span{font:400 10.5px var(--f-data);color:var(--graphite)}
.lp-pop{position:absolute;top:46px;left:0;width:380px;max-width:calc(100vw - 40px);padding:6px;z-index:6;max-height:70vh;overflow-y:auto}
.lp-g{font:600 10px var(--f-data);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 8px 4px}
.lp-row{display:grid;grid-template-columns:30px minmax(0,1fr) auto 8px;gap:10px;align-items:center;width:100%;border:0;background:none;padding:7px 8px;border-radius:var(--r);text-align:left;color:var(--ink)}
.lp-row:hover{background:var(--rule-soft)} .lp-row[aria-checked="true"]{background:color-mix(in srgb,var(--lemon) 18%,transparent)}
.lp-row.off{opacity:.55}
.lp-m{font:400 10px/1.35 var(--f-data);color:var(--graphite);text-align:right}
.live{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 18%,transparent)}
.srcline{display:flex;align-items:center;gap:7px;margin-top:8px;padding-top:7px;border-top:1px solid var(--rule-soft);font:400 10.5px var(--f-data);color:var(--graphite)}
.lst-cmp{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:11.5px;color:var(--graphite)} .lst-cmp b{color:var(--ink);font-family:var(--f-data)}
.nb-leg{display:flex;flex-direction:column;gap:6px;margin-top:8px;font-size:12px}
.nb-leg span{display:flex;align-items:center;gap:8px}
.notebook .legend{width:auto}

/* Zaman şeridi */
.dock{flex:0 0 auto;background:var(--sheet);border-top:1px solid var(--rule);padding:10px 16px 8px}
.dock-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dock-h .readout{margin-left:auto;display:flex;align-items:baseline;gap:10px}
.dock-h .readout .big{font:600 22px var(--f-data)}
.playbtn{width:32px;height:32px;border:1px solid var(--rule);background:var(--sheet);border-radius:3px;display:grid;place-items:center}
#dockSvg{display:block;width:100%;margin-top:6px}
.dock{padding:8px 16px 6px}

/* Sağ panel */
:root{--band-90:color-mix(in srgb,var(--good) 10%,transparent);--band-50:color-mix(in srgb,var(--good) 22%,transparent)}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.linkbtn{border:0;background:none;padding:0;font-weight:600;font-size:12.5px;color:var(--ink);border-bottom:1px solid var(--ink)}
.warnt{color:var(--warn);font-weight:600}
.score-head{display:flex;gap:18px;align-items:center}
.score-n{display:flex;align-items:baseline;flex:0 0 auto}
.score-n b{font:700 54px/1 var(--f-data);letter-spacing:-.04em}
.score-n span{font:500 14px var(--f-data);color:var(--muted);margin-left:3px}
.scorebar{display:flex;height:10px;background:var(--rule-soft);border-radius:5px;overflow:hidden}
.scorebar i{display:block;height:100%;background:var(--good)}
.scorebar i.ded{background:repeating-linear-gradient(45deg,var(--warn) 0 2px,transparent 2px 5px);background-color:color-mix(in srgb,var(--warn) 12%,transparent);border-left:2px solid var(--sheet)}
.sb-legend,.sc-legend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:11.5px;color:var(--graphite)}
.sb-legend span,.sc-legend span{display:inline-flex;align-items:center;gap:6px}
.sb-legend .warn{color:var(--warn)}
.lg{display:inline-block;width:14px;height:10px;border-radius:2px}
.lg.sgood{background:var(--good)} .lg.sded{background:repeating-linear-gradient(45deg,var(--warn) 0 2px,transparent 2px 5px);border:1px solid var(--warn)}
.lg.b90{background:var(--band-90);border:1px solid var(--rule)} .lg.b50{background:var(--band-50)}
.lg.med{height:0;border-top:1.5px dashed var(--graphite);border-radius:0} .lg.now{height:0;border-top:2.5px solid var(--ink);border-radius:0}
.buls{display:flex;flex-direction:column;gap:2px}
.bul{display:grid;grid-template-columns:96px minmax(0,1fr) 118px;gap:14px;align-items:center;width:100%;border:0;background:none;padding:10px 8px;border-radius:var(--r);text-align:left;color:var(--ink)}
.bul:hover{background:var(--rule-soft)}
.bul.on{background:color-mix(in srgb,var(--lemon) 16%,transparent)}
.bl-n{display:flex;flex-direction:column;gap:1px}
.bl-n b{font-weight:700;font-size:13.5px}
.bl-n span{font:400 10.5px var(--f-data);color:var(--muted)}
.bl-track{position:relative;height:24px}
.bl-track i{position:absolute;top:50%;transform:translateY(-50%);display:block}
.bl-track .r90{height:8px;background:var(--band-90);border:1px solid var(--rule);border-radius:4px}
.bl-track .r50{height:8px;background:var(--band-50);border-radius:4px}
.bl-track .med{width:2px;height:16px;background:var(--graphite);margin-left:-1px}
.bl-track .dot{width:13px;height:13px;border-radius:50%;margin-left:-6.5px;border:2px solid var(--sheet);box-shadow:0 0 0 1.2px var(--ink);background:var(--ink)}
.bl-track .dot.low{background:var(--warn)} .bl-track .dot.hi{background:var(--good)}
.bl-v{display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.bl-v b{font:700 17px var(--f-data)}
.bl-v span{font-size:11px;color:var(--graphite);text-align:right}
.bl-v span.low{color:var(--warn);font-weight:600}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fact{display:flex;flex-direction:column;gap:3px;text-align:left;border:1px solid var(--rule-soft);border-radius:var(--r);background:none;padding:12px 14px;color:var(--ink)}
.fact:hover{border-color:var(--rule)}
.fact b{font:700 20px var(--f-data)} .fact b small{font-size:12px;font-weight:500;color:var(--graphite)}
.hist-cta{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:16px;align-items:center;width:100%;text-align:left;border:1px solid var(--rule);border-radius:var(--r);background:var(--paper);padding:14px 16px;color:var(--ink)}
.hist-cta:hover{border-color:var(--ink)}
.hist-cta > span:first-child{display:flex;flex-direction:column;gap:3px}
.hist-cta b{font-size:16px}
.hist-cta .arr{font-size:18px}
.srcchip{display:inline-flex;align-items:center;gap:7px;font:400 10.5px var(--f-data);color:var(--graphite);align-self:flex-start;border:1px solid var(--rule-soft);padding:3px 8px 3px 6px;border-radius:20px}
.smapwrap{display:grid;grid-template-columns:170px minmax(0,1fr);gap:16px;align-items:start}
.smapwrap .srcchip{margin-top:10px}
/* Geçmiş sayfası */
.hp{flex:1;overflow-y:auto;background:var(--paper);min-height:0}
.hp-head{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:12px 24px;background:var(--sheet);border-bottom:1px solid var(--rule)}
.hp-title{margin:2px 0 0;font:700 22px/1.1 var(--f-display);letter-spacing:-.02em}
.hp-body{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;padding:20px 24px 40px;max-width:1480px;margin:0 auto}
.hp-card{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.hp-card.wide{grid-column:1/-1}
.hp-card header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.multiples.big{grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
/* Saha turu */
.tour{display:flex;flex-direction:column;gap:10px}
.tour .no,.plate .no{font:500 10.5px var(--f-data);letter-spacing:.09em;color:var(--graphite)}
.nb-h{margin:0;font:500 28px/1.15 var(--f-display);letter-spacing:-.01em}
.tour p{margin:0;font:400 15px/1.45 var(--f-display)}
.tour-acts{display:flex;gap:8px;flex-wrap:wrap}
.prog{display:flex;align-items:center;gap:10px;font:400 11px var(--f-data);color:var(--graphite)}
.prog .bar{flex:1;height:4px;background:var(--rule)} .prog .bar i{display:block;height:100%;background:var(--ink)}
.stops{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
.stop{border-bottom:1px solid var(--rule)}
.stop-h{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:start;width:100%;border:0;background:none;padding:12px 0;text-align:left;color:var(--ink)}
.stop .no{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font:600 12px var(--f-data);background:var(--paper)}
.stop.on .no{background:var(--lemon);color:#17201B}
.stop.done .no{background:var(--ink);color:var(--paper)}
.stop.done .stop-h b{text-decoration:line-through;text-decoration-thickness:1px;color:var(--graphite)}
.stop-h b{display:block;font:500 17px/1.25 var(--f-display)}
.why{display:block;font-size:12.5px;color:var(--graphite);margin-top:2px}
.stop-b{padding:0 0 16px 42px;display:flex;flex-direction:column;gap:9px}
.ck{display:flex;gap:10px;align-items:center;font-size:13.5px}
.ck input[type=checkbox]{width:17px;height:17px;accent-color:var(--ink);margin:0}
.trapin input,.traps input{width:70px;height:32px;border:1px solid var(--ink);background:var(--sheet);padding:0 8px;font:500 13px var(--f-data);color:var(--ink)}
.stop-b textarea{min-height:66px;border:1px solid var(--rule);background:var(--sheet);padding:8px 10px;font:400 14.5px/1.4 var(--f-display);resize:vertical;color:var(--ink)}
.row-acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
table.traps{width:100%;border-collapse:collapse;font-size:13px}
table.traps th{font:500 10px var(--f-data);letter-spacing:.07em;color:var(--graphite);text-align:left;padding:6px 0;border-bottom:1px solid var(--ink)}
table.traps td{padding:8px 0;border-bottom:1px solid var(--rule-soft);vertical-align:middle}

<script>
(() => {
/* ---------- Veri (temsili; ürün gerçek API verisini kullanır) ---------- */
const M = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
const MF = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const NDVI = [.46,.47,.49,.52,.51,.48,.45,.44,.45,.43,.45,.46];
const NDVI_PREV = [.45,.46,.48,.50,.50,.47,.45,.45,.46,.44,.45,.45];
const NDMI = [.24,.25,.24,.23,.22,.2,.17,.16,.17,.18,.2,.23];
const NDRE = [.29,.30,.31,.33,.33,.31,.29,.28,.29,.30,.30,.30];
// 2015–2025 aynı ay dağılımı (temsili): [p10,p25,ortanca,p75,p90]
const envOf=(arr,sd)=>arr.map((v,m)=>{ const c=v+.004*Math.sin(m*1.3); return [c-2*sd,c-sd,c,c+sd,c+2*sd]; });
const LAI=[3.3,3.3,3.4,3.7,3.9,3.8,3.6,3.5,3.5,3.4,3.4,3.3];
const MSAVI=[.43,.44,.46,.49,.48,.45,.42,.41,.42,.40,.42,.43];
const VH=[-12.6,-12.9,-13.4,-14.0,-14.6,-15.2,-15.7,-15.8,-15.3,-13.9,-13.1,-12.7];
const LSTM=[14.2,15.1,18.4,22.6,27.3,31.8,35.2,35.6,33.4,31.4,22.1,16.4];
const ENV={ lai:envOf(LAI.map(v=>v+.05),.12), msavi:envOf(MSAVI.map(v=>v+.008),.012), vh:envOf(VH.map(v=>v-.6),.5), lst:envOf(LSTM.map(v=>v-.8),.9), ndvi:envOf(NDVI_PREV.map(v=>v+.006),.014), ndmi:envOf(NDMI.map(v=>v+.012),.012), ndre:envOf(NDRE.map(v=>v+.004),.01) };
const SER={ ndvi:NDVI, ndmi:NDMI, ndre:NDRE, lai:LAI, msavi:MSAVI, vh:VH, lst:LSTM };
const LNAME={ ndvi:['Canlılık','NDVI · 10 m'], ndre:['Klorofil','NDRE · 20 m'], lai:['Yaprak alanı','LAI · 20 m'], msavi:['Taç ve toprak','MSAVI · 10 m'], ndmi:['Yaprak suyu','NDMI · 20 m'], vh:['Radar nemi','S1 VH · 10 m'], lst:['Yüzey sıcaklığı','LST · 100 m'] };
const LASTM=9;
function grad(r){ return 'linear-gradient(90deg,'+r.map(q=>q[1]+' '+(q[0]*100)+'%').join(',')+')'; }
function band(k,m){ const e=ENV[k][m], v=SER[k][m];
  if(v<e[0]) return ['low','son 11 yılın en düşüğü']; if(v<e[1]) return ['low','normalin alt kısmı']; if(v<=e[3]) return ['ok','normal aralıkta']; if(v<=e[4]) return ['hi','normalin üstü']; return ['hi','son 11 yılın en yükseği']; }
const RAIN = [112,91,69,42,28,11,3,4,21,57,83,119];
const PHEN = [[349,365,'Dinlenme','#DDD8CA'],[0,46,'Dinlenme','#DDD8CA'],[46,73,'Tomurcuk','#D7E0C2'],[73,120,'Çiçek','#F1E6B8'],[120,166,'Tutum','#CFDCB0'],[166,273,'Büyüme','#BFD3A2'],[273,349,'Olgunlaşma','#EAD49A']];
const YEARS = [[2015,.59],[2016,.63],[2017,.70],[2018,.67],[2019,.60],[2020,.74],[2021,.47],[2022,.80],[2023,.78],[2024,.67],[2025,.63],[2026,.43]];
const ODD = y => y===2021 || y===2026;
const NI = 10, NJ = 15, CELL = 24, ROT = -26*Math.PI/180;

const S = { pt:0, done:{}, ck:{}, notes:{}, trapToday:{}, hIdx:'ndvi', nav:'bahce', tab:'durum', mode:'uydu', layer:'ndvi', contours:true, opacity:.88, month:9, year:null, inspect:null, hoverBin:null, focusWeak:false, playing:false, answered:null, chat:0, dockOpen:false };
try{ S.dockOpen = localStorage.getItem('bl-dock')==='1'; }catch(e){}

const fmt = (n,d=2) => n.toFixed(d).replace('.',',');
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
function pattern(i,j){
  return .55*Math.sin(i*.9+1) + .45*Math.cos(j*.55)
    - 1.25*Math.exp(-((i-2)**2+(j-11)**2)/6)
    + 1.05*Math.exp(-((i-7)**2+(j-2)**2)/5)
    + .18*((((i*7+j*13)%5)-2)/2);
}
function cellVal(i,j){
  const p = pattern(i,j);
  if(S.year!=null){
    const y=S.year;
    if(ODD(y)) return .44 + .05*Math.sin(j*.7+i*.4+y) - .03*Math.cos(i*1.3);
    return .455 + .045*p + .012*Math.sin((i+y)*1.7+j*.9);
  }
  if(S.layer==='ndmi') return NDMI[S.month] + .03*p + .006*Math.sin(i*1.3+S.month);
  if(S.layer==='lai') return LAI[S.month] + .45*p + .04*Math.sin(i*1.7+j);
  if(S.layer==='msavi') return MSAVI[S.month] + .04*p + .006*Math.sin(i+j*1.3);
  if(S.layer==='vh') return VH[S.month] + .9*p + .25*Math.sin(i*2.1+j*1.7);
  if(S.layer==='lst') return LSTM[S.month] - 1.2*p;
  if(S.layer==='ndre') return NDRE[S.month] + .026*p + .005*Math.sin(i*.9+j*.4+S.month);
  return NDVI[S.month] + .045*p + .008*Math.sin(i*1.1+j*.7+S.month*1.9);

function bindDivider(){
  const d=$('#divider'), left=$('#left'), work=$('#work');
  let drag=false;
  const set=f=>{ f=clamp(f,.45,.8); left.style.flex=`1 1 ${f*100}%`; $('#right').style.flex=`1 1 ${(1-f)*100}%`; try{localStorage.setItem('bl-split2',f)}catch(_){} resizeMap(); };
  try{ const f=parseFloat(localStorage.getItem('bl-split2')); if(f) set(f); }catch(_){}
  d.addEventListener('pointerdown',e=>{drag=true; d.setPointerCapture(e.pointerId);});
  d.addEventListener('pointermove',e=>{ if(!drag) return; const r=work.getBoundingClientRect(); set((e.clientX-r.left)/r.width); });
  d.addEventListener('pointerup',()=>drag=false);
  d.addEventListener('keydown',e=>{ const r=work.getBoundingClientRect(), cur=left.getBoundingClientRect().width/r.width; if(e.key==='ArrowLeft') set(cur-.03); if(e.key==='ArrowRight') set(cur+.03); });
}

function gauge(score){
  let s=''; for(let k=0;k<60;k++){ const a=(k*6-90)*Math.PI/180, on=k<score*.6, r1=on?45:47, r2=56;
    s+=`<line x1="${(60+r1*Math.cos(a)).toFixed(2)}" y1="${(60+r1*Math.sin(a)).toFixed(2)}" x2="${(60+r2*Math.cos(a)).toFixed(2)}" y2="${(60+r2*Math.sin(a)).toFixed(2)}" stroke="${on?'var(--ink)':'var(--rule)'}" stroke-width="${k%5===0?2.2:1.2}"/>`; }
  return `<div class="gauge"><svg viewBox="0 0 120 120" width="118" height="118" role="img" aria-label="Bahçe durumu ${score} / 100">${s}</svg><div class="n"><b>${score}</b><span>/ 100</span></div></div>`;
}
function wheel(){
  const cx=95,cy=95,P=(r,deg)=>{const a=(deg-90)*Math.PI/180;return [cx+r*Math.cos(a),cy+r*Math.sin(a)]};
  const arc=(r1,r2,a0,a1)=>{const L=(a1-a0)>180?1:0,p=(r,a)=>P(r,a).map(n=>n.toFixed(2)).join(' ');return `M${p(r2,a0)}A${r2} ${r2} 0 ${L} 1 ${p(r2,a1)}L${p(r1,a1)}A${r1} ${r1} 0 ${L} 0 ${p(r1,a0)}Z`;};
  const deg=d=>d/365*360;
  let s=PHEN.map(p=>`<path d="${arc(64,76,deg(p[0]),deg(p[1]))}" fill="${p[3]}" stroke="var(--sheet)"/>`).join('');
  s+=`<circle cx="${cx}" cy="${cy}" r="60" fill="none" stroke="var(--rule-soft)"/>`;
  s+=RAIN.map((r,k)=>{const a=(k+.5)*30,p1=P(22,a),p2=P(22+r/120*20,a);return `<line x1="${p1[0]}" y1="${p1[1]}" x2="${p2[0]}" y2="${p2[1]}" stroke="var(--water)" stroke-width="6" opacity=".8"/>`}).join('');
  let d=''; for(let k=0;k<=12;k++){const p=P(46+(NDVI[k%12]-.43)*160,(k+.5)*30); d+=(k?'L':'M')+p[0].toFixed(2)+' '+p[1].toFixed(2);} s+=`<path d="${d}" fill="none" stroke="var(--ink)" stroke-width="1.4"/>`;
  s+=M.map((m,k)=>{const p=P(86,(k+.5)*30); const on=k===S.month; return `<g data-month="${k}" style="cursor:pointer"><circle cx="${p[0]}" cy="${p[1]}" r="9" fill="${on?'var(--lemon)':'transparent'}"/><text x="${p[0]}" y="${p[1]+3}" font-size="8" text-anchor="middle" font-family="var(--f-data)" style="font-family:var(--f-data)" fill="${on?'#17201B':'var(--graphite)'}" font-weight="${on?600:400}">${m}</text></g>`}).join('');
  const t=P(78,(S.month+.37)*30); s+=`<line x1="${cx}" y1="${cy}" x2="${t[0]}" y2="${t[1]}" stroke="var(--watch)" stroke-width="1.4"/><circle cx="${cx}" cy="${cy}" r="2.2" fill="var(--ink)"/>`;
  return `<svg viewBox="0 0 190 190" width="190" height="190" role="img" aria-label="Limon yılı çarkı: dış halka fenoloji evreleri, çizgi canlılık, çubuklar aylık yağış. Bir ay seçin.">${s}</svg>`;
}

function paintMultiples(){

    g.save(); g.translate(Z/2,Z/2); g.rotate(ROT); g.scale(.27*Z/120,.27*Z/120);
    const vals=[]; for(let i=0;i<NI;i++) for(let j=0;j<NJ;j++){ const v=ODD(y)?.04*Math.sin(j*.7+i*.4+y)-.02*Math.cos(i*1.3):.045*pattern(i,j)+.012*Math.sin((i+y)*1.7+j*.9); vals.push([i,j,v]); }
    const mn=Math.min(...vals.map(v=>v[2])), mx=Math.max(...vals.map(v=>v[2]));

    g.lineWidth=3; g.strokeStyle=css('--ink'); g.strokeRect(-120,-180,240,360); g.restore();
  });
}

    r[2].forEach(d=>{ if(d>=n) return; all++; const c=(r[3]==='c'||r[3]==='t')&&isC(d); if(!c) net++;

/* ---------- Asistan ---------- */
const QA=[
  ['Bahçem son iki haftada nasıl?','Canlılık 0,43; iki hafta öncesine göre %5,9 düşük. Bu düşüş ekim ayının mevsim normali içinde. Yaprak suyu %11,9 düştü ve izleniyor; 15 Ekim yağışı bunu toparlayabilir.'],
  ['Zayıf bölge neden zayıf?','Güney-batı köşe 12 yazın 10\'unda bahçe ortalamasının altında kaldı, yani geçici değil. Uydu nedeni söyleyemez: toprak, sulama dağılımı veya ağaç yaşı olabilir. Önce yerinde bakmanızı ve toprak örneği almanızı öneririm.'],
  ['Bu hafta ilaçlama için en iyi gün?','Salı 06:47–18:09 en uzun uygun aralık. Perşembe ve cuma yağış nedeniyle uygun değil.']
];
function assistantPage(){
  const turns=QA.slice(0,S.chat+1);
  return `<div class="page">
    <aside><button class="btn primary" type="button" id="newChat" style="width:100%">Yeni sohbet</button>
      <div class="eyebrow" style="margin:18px 0 6px">jlnnlk</div>${QA.map((q,k)=>`<button class="hist-item" type="button" data-q="${k}" aria-current="${k===S.chat}">${q[0]}</button>`).join('')}
      <div class="eyebrow" style="margin:18px 0 6px">Genel</div><button class="hist-item" type="button" data-toast="Hibe ajanı Faz 1.5'te">Hibe başvurusu için neler gerekir?</button></aside>
    <section class="chat" aria-label="Sohbet">
      <div class="thread">
        <div class="mono small" style="border:1px dashed var(--rule);padding:8px 12px">Önizleme · Asistan Adım 16'da açılır. Aşağıdaki cevaplar bu bahçenin verisinden örnek bloklardır.</div>
        ${turns.map((t,k)=>`<div class="msg-u">${t[0]}</div><div class="msg-a"><p>${t[1]}</p>
          ${k===0?`<div class="blocks"><div class="block"><div class="eyebrow">Canlılık · 12 ay</div>${spark(NDVI,240,46,true)}</div><div class="block"><div class="eyebrow">Durum</div><div style="display:flex;align-items:center;gap:10px;margin-top:6px"><b class="mono" style="font-size:28px">90</b><span class="pill good"><i></i>İyi</span></div><div class="reason">−10 · meyve sineği orta</div></div></div>`:''}
          ${k===1?`<div class="blocks"><div class="block"><div class="eyebrow">Zayıf bölge</div><div class="mono" style="font-size:22px;margin-top:4px;color:var(--warn)">−4,6%</div><div class="small">6,7 da · %79 istikrar</div></div><div class="block" style="display:flex;flex-direction:column;justify-content:space-between"><div class="eyebrow">Eylem</div><button class="btn" type="button" data-cmd="weak">Haritada göster</button></div></div>`:''}
          <div class="srcs"><span class="eyebrow">Dayandığı veri</span><span class="tag">Sentinel-2 · 9 Eki</span><span class="tag">Open-Meteo · 7 gün</span><span class="tag">Kural: ön değer</span></div></div>`).join('')}
      </div>
      <div class="composer"><div class="sugs">${QA.map((q,k)=>`<button type="button" data-q="${k}">${q[0]}</button>`).join('')}<button type="button" data-cmd="weak">Zayıf bölgeleri göster</button></div>
        <form class="inputrow" id="ask"><label for="askIn" style="position:absolute;width:1px;height:1px;overflow:hidden">Sorunuz</label><input id="askIn" placeholder="Bahçeniz hakkında sorun…" autocomplete="off"><button class="btn primary" type="submit">Sor</button></form></div>
    </section>
    <aside class="ctx"><div class="eyebrow">Seçili bahçe</div>
      <div style="display:flex;gap:12px;align-items:center;margin:10px 0 18px">${gauge(90).replace('width="118" height="118"','width="64" height="64"').replace('class="gauge"','class="gauge" style="width:64px;height:64px;flex:0 0 64px"').replace('<b>90</b>','<b style="font-size:18px">90</b>').replace('<span>/ 100</span>','')}<div><div style="font:500 20px var(--f-display)">jlnnlk</div><div class="small">Limon · 15,1 da</div></div></div>
      <div class="eyebrow">Cevabın dayandığı veri</div>
      <div style="display:flex;flex-direction:column;margin-top:8px;border-top:1px solid var(--rule)">${[['Canlılık serisi','78 net görüntü'],['Hava','Open-Meteo · 7 gün'],['Bölgeler','12 yaz · 2015–2026'],['Bahçe kuralları','ön değer']].map(r=>`<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--rule-soft);font-size:12.5px"><span>${r[0]}</span><span class="mono small">${r[1]}</span></div>`).join('')}</div>
    </aside></div>`;
}
function bindAssistant(){
  $('#ask').addEventListener('submit',e=>{ e.preventDefault(); toast('Serbest soru Adım 16 ile açılıyor'); });
}
document.addEventListener('click',e=>{
  const q=e.target.closest('[data-q]'); if(q){ S.chat=+q.dataset.q; $('#main').innerHTML=assistantPage(); bindAssistant(); return; }
  if(e.target.closest('#newChat')){ S.chat=0; $('#main').innerHTML=assistantPage(); bindAssistant(); return; }
  const c=e.target.closest('[data-cmd]'); if(c){ runCmd(c.dataset.cmd); return; }
});

function soonPage(k){
  const info={isler:['İşlerim','Ajanlar süreci baştan sona yürütür: hibe dosyası, kalıntı uyumu, sertifika, sigorta ve kredi.','Faz 1.5'],hizmet:['Hizmetler','Drone ilaçlama, budama ve hasat ekibi, laboratuvar analizi ve ziraat mühendisi tek yerden.','Faz 1.5'],pazar:['Pazar','Günlük limon fiyatı, soğuk depo stoku ve satış; girdi ve finansman ortaklarla.','Adım 17']}[k];
  return `<div class="soonpage"><div class="card">${BOT}<div><div class="eyebrow">${info[2]}</div><h2 class="title" style="margin-top:6px">${info[0]}</h2><p class="lede" style="margin-top:10px">${info[1]}</p><button class="btn" type="button" style="margin-top:16px" data-back>Bahçelere dön</button></div></div></div>`;
}
document.addEventListener('click',e=>{ if(e.target.closest('[data-back]')){ S.nav='bahce'; renderAll(); } });

/* ---------- Komut paleti ---------- */
const CMDS=[
  ['weak','Zayıf bölgeleri göster','Haritada taralı kesim + Analiz'],
  ['compare','Geçmişi aç','12 yıl · sezon eğrisi · yıl yıl harita'],
  ['spray','İlaçlama zamanı','Hava · saat saat uygunluk'],
  ['defter','Saha turunu aç','Saha Defteri · kontrol noktaları, tuzaklar'],
  ['change','Değişim haritası','Önceki aya göre fark'],
  ['ask','Asistana sor','Sohbet sayfası']
];
let palIdx=0;
function openPalette(){
  $('#layer').innerHTML=`<div class="palette-bg" id="palBg"><div class="palette" role="dialog" aria-label="Komutlar"><label for="palIn" style="position:absolute;width:1px;height:1px;overflow:hidden">Komut ara</label><input id="palIn" placeholder="Ne yapmak istersiniz? Örn. zayıf bölgeleri göster" autocomplete="off"><ul id="palList"></ul></div></div>`;
  palIdx=0; renderPal(''); $('#palIn').focus();
  $('#palIn').addEventListener('input',e=>{palIdx=0; renderPal(e.target.value)});
  $('#palIn').addEventListener('keydown',e=>{ const items=[...document.querySelectorAll('#palList button')];
    if(e.key==='ArrowDown'){palIdx=Math.min(items.length-1,palIdx+1);renderPal($('#palIn').value);e.preventDefault();}
    if(e.key==='ArrowUp'){palIdx=Math.max(0,palIdx-1);renderPal($('#palIn').value);e.preventDefault();}
    if(e.key==='Enter'&&items[palIdx]){items[palIdx].click();}
    if(e.key==='Escape') closePalette(); });
  $('#palBg').addEventListener('click',e=>{ if(e.target.id==='palBg') closePalette(); });
}
function renderPal(q){
  const n=q.toLocaleLowerCase('tr'); const list=CMDS.filter(c=>c[1].toLocaleLowerCase('tr').includes(n)||c[2].toLocaleLowerCase('tr').includes(n));
  $('#palList').innerHTML=list.map((c,k)=>`<li><button type="button" data-cmd="${c[0]}" aria-selected="${k===palIdx}"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12H19M13 6L19 12L13 18" fill="none" stroke="currentColor" stroke-width="1.6"/></svg><span>${c[1]}</span><span class="hint">${c[2]}</span></button></li>`).join('') || `<li class="small" style="padding:12px">Komut bulunamadı. Asistana sormak için Enter.</li>`;
}
function closePalette(){ $('#layer').innerHTML=''; }
function runCmd(c){
  closePalette();
  const toBahce=()=>{ if(S.nav!=='bahce'){ S.nav='bahce'; renderAll(); } };
  if(c==='weak'){ toBahce(); S.focusWeak=true; S.layer='ndvi'; S.tab='analiz'; renderGardenBar(); renderPane(); drawMap(); toast('Zayıf kesim haritada taralı gösteriliyor'); }
  if(c==='compare'){ S.nav='gecmis'; renderAll(); }
  if(c==='spray'){ toBahce(); S.tab='hava'; renderGardenBar(); renderPane(); }
  if(c==='defter'){ S.nav='defter'; renderAll(); }
  if(c==='change'){ toBahce(); S.layer='change'; drawMap(); }
  if(c==='ask'){ S.nav='asistan'; renderAll(); }
}
$('#openCmd').addEventListener('click',openPalette);
document.addEventListener('keydown',e=>{ if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); openPalette(); } });

/* ---------- Tema ---------- */
$('#themeBtn').addEventListener('click',()=>{ const r=document.documentElement; const dark = r.dataset.theme ? r.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark?'light':'dark'; baseKarto=null; baseUydu=null; if(S.nav==='bahce'||S.nav==='defter'){ drawMap(); renderDock(); if(S.nav==='bahce') renderPane(); else refreshNotebook(); } if(S.nav==='gecmis') renderAll(); toast(dark?'Açık tema':'Koyu tema'); });

let toastT=0; function toast(t){ clearTimeout(toastT); let el=document.querySelector('.toast'); if(!el){ el=document.createElement('div'); el.className='toast'; el.setAttribute('role','status'); document.body.appendChild(el);} el.textContent=t; toastT=setTimeout(()=>el.remove(),2200); }
window.addEventListener('resize',()=>{ if(S.nav==='bahce'||S.nav==='defter') renderDock(); });

renderAll();
})();
</script>
