[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bahcelab-backend"
version = "0.1.0"
description = "BahçeLab Planning & Simulation API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic-settings>=2.6.0",
    "shapely>=2.0.6",
    "pyproj>=3.7.0",
    "python-multipart>=0.0.12",
    "argon2-cffi>=23.1.0",
    "geoalchemy2>=0.15.2",
    "pystac-client>=0.8.0",
    "planetary-computer>=1.0.0",
    "rasterio>=1.4.0",
    "numpy>=2.0",
    "Pillow>=10.0",
    "PyJWT>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bahcelab_backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests requiring a running PostgreSQL database",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# Biçimlendirici kodu sarar; uzun Türkçe açıklama/docstring satırları için E501 kapalı
ignore = ["E501"]
