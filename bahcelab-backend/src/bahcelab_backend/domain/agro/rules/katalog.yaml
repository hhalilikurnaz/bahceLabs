  # Kısıntılı sulama: yalnız onaylı dönemde; çiçeklenme–meyve tutumu ve hızlı meyve büyümesi KİLİTLİ. Oran ve risk ön değer · mühendis onayı bekliyor
  kisitli_donemler:
