# Ürün / çeşit kataloğu: fenoloji evreleri, Kc ve GDD tabanı.
# TÜM DEĞERLER "doğrulanmadı" (ön değer): uygulamada "ön değer – ziraat mühendisi onayı bekleniyor" rozetiyle gösterilir.
# Bir değer mühendis tarafından onaylanınca ilgili bloğun `durum` alanı `muhendis_onayli` yapılır ve `onaylayan`/`onay_tarihi` eklenir.
# Kod içinde tarım sabiti yoktur; bu dosya sürümlüdür (`surum`). Tarihler "AA-GG" biçimindedir; evre yıl sonunu aşabilir (12-15 → 02-15).
surum: 1
sezon_baslangici: "10-01"   # su yılı (DSİ/MGM ile uyumlu); weather/rules.py ile aynı kural

# Durum kademesi (v1): iç skor (0–100) yalnız kademeyi belirler, arayüze ÇIKMAZ. Aktif risk varken kademe en fazla «İzle» olur.
# Tam formül 9F'de (Durum v2). Eşikler ön değerdir.
durum_kademesi:
  durum: dogrulanmadi
  kaynak: >-
    Ön değer · v1: ≥85 İyi · 70–84 İzle · 50–69 Dikkat · <50 Sorun. Bileşen çipi: ≥90 normal · 50–89 normalin altı · ≤49 belirgin düşük.
    Mevcut skorun geçici türetmesidir; Durum v2'de (9F) tam formül ve mühendis onayıyla değişecek.
  iyi_min: 85
  izle_min: 70
  dikkat_min: 50
  bilesen_normal_min: 90
  bilesen_belirgin_dusuk_max: 49

# Narenciye için ortak ön değerler (ürün blokları bunu `miras` ile kullanır)
varsayilan_narenciye: &narenciye
  fenoloji:
    durum: dogrulanmadi
    kaynak: >-
      Akdeniz kuşağı narenciye fenolojisinin genel kabul gören yaklaşık takvimi (ön değer).
      Yerel ilçe tarım müdürlüğü / Ziraat Odası takvimiyle doğrulanmalıdır; bölge, yıl ve çeşide göre ±3 hafta oynar.
    evreler:
      - {kod: kis_dinlenme, ad: "Kış dinlenmesi", baslangic: "12-15", bitis: "02-15"}
      - {kod: tomurcuklanma, ad: "Tomurcuklanma ve sürgün", baslangic: "02-16", bitis: "03-14"}
      - {kod: ciceklenme, ad: "Çiçeklenme", baslangic: "03-15", bitis: "04-30"}
      - {kod: meyve_tutumu, ad: "Meyve tutumu", baslangic: "05-01", bitis: "06-15"}
      - {kod: meyve_gelisimi, ad: "Meyve büyümesi", baslangic: "06-16", bitis: "09-30"}
      - {kod: olgunlasma, ad: "Olgunlaşma ve hasat", baslangic: "10-01", bitis: "12-14"}
  kc:
    durum: dogrulanmadi
    kaynak: >-
      FAO Sulama ve Drenaj Makalesi 56, Tablo 12 (narenciye, örtü bitkisiz: başlangıç 0,70 · orta 0,65 · son 0,70) değerlerinden
      evrelere dağıtılmış ön değer; yerel ölçümle uyarlanmamıştır.
    degerler:
      kis_dinlenme: 0.65
      tomurcuklanma: 0.65
      ciceklenme: 0.70
      meyve_tutumu: 0.70
      meyve_gelisimi: 0.65
      olgunlasma: 0.65
  gdd:
    durum: dogrulanmadi
    kaynak: >-
      Narenciyede büyüme derece günü tabanı yayınlarda yaklaşık 10–13 °C arasında kullanılır; 12,5 °C ön değerdir
      (günlük: max(0, (Tmax+Tmin)/2 − taban)). Böcek gelişimi için ayrı taban 8B risk kurallarında tanımlanır.
    taban_c: 12.5
  analiz_penceresi:
    durum: dogrulanmadi
    kaynak: >-
      Çok yıllık ağaç gücü bölgeleri için yıllık kompozit penceresi (ön değer): Haziran–Eylül. Narenciye herdem yeşildir; yazın sıra arası
      otlar kuruduğundan uydu sinyali ağaç tacını daha iyi yansıtır ve Akdeniz'de bulutlu sahne azdır. Ziraat mühendisiyle doğrulanmalıdır.
    ay_baslangic: 6
    ay_bitis: 9
    indeks: ndvi
    # Yeterlilik eşikleri de ön değerdir (mühendis onayı bekliyor): pencerede en az 3 farklı günde net sahne ve ayların en az
    # %75'inde (4 aydan 3'ü) net sahne. Sentinel-2 arşivi 13 Ağu 2015'te başlar; ilk yıllar bu yüzden «yetersiz veri» çıkabilir.
    en_az_net_sahne: 3
    en_az_ay_kapsami: 0.75
  tipik_bantlar:
    ndvi:
      durum: dogrulanmadi
      kaynak: >-
        10 m Sentinel-2 NDVI'sinde dikili narenciye bahçesi için yaz dönemi tipik aralığı (ön değer): ağaç tacı ve sıra arası birlikte 0,45–0,70.
        Seyrek dikim, genç ağaç ve çıplak toprakta altına; sık ve olgun bahçede üstüne çıkabilir. Ziraat mühendisiyle doğrulanmalıdır.
      alt: 0.45
      ust: 0.70

# Normal bant (gösterge × ay): bahçenin kendi 2015–(geçen yıl) dağılımı. Yetersiz veri ve uyumsuz/hariç yıllar banda girmez. Ön değerler.
normal_bant:
  durum: dogrulanmadi
  kaynak: >-
    Ön değer: p25–p75 (ve ortanca) için en az 5 yıl, p10–p90 için en az 8 yıl. Altında «yetersiz geçmiş» yazılır, yüzdelik gösterilmez.
    Yıl sayısı küçük olduğundan uçlar gürültülüdür; ziraat mühendisiyle doğrulanmalıdır.
  asgari_yil_ceyrek: 5
  asgari_yil_onluk: 8
  ilk_yil: 2015
  # Çip, çubuk ve kademe AYNI kuralı kullanır: p25–p75 normal · p10–p25 normalin alt kısmı · p10 altı belirgin düşük (ön değer).

# Sentinel-1 radar (ADR 0016): hepsi ön değer
radar:
  durum: dogrulanmadi
  kaynak: >-
    Ön değer: VH < −30 dB gölge, VV > +5 dB üst üste binme/doygunluk vekili (PC RTC varlıklarında maske bandı yok);
    Lee 5×5, ENL 4,4; bahçenin >%30'u maskeliyse sahne değişime girmez; |Δ| ≥ 2 dB ve eşiği aşan piksellerin en büyük bitişik (8-komşuluk) yaması ≥ min(bahçenin %25'i, 5 da) anlamlı değişim;
    önceki 48 saatte ≥ 1 mm yağış → «ıslaklık olabilir»; ani değişim = son sahne vs aynı yörüngedeki son 3 sahnenin ortancası; «ıslaklık olabilir» notlu aday güveni düşük sayılır (9F bildirime çevirmez); olay adayı = anlamlı ani değişim VE (kalıcı sapma bant dışında ya da 2 ardışık sahnede aynı yönde), tek sahnelik sıçrama «gürültü». Ziraat mühendisi/uzaktan algılama uzmanı onayı bekliyor.
  golge_vh_alt_db: -30.0
  ust_uste_vv_ust_db: 5.0
  lee_pencere: 5
  lee_bakis: 4.4
  azami_maske_orani: 0.30
  anlamli_degisim_db: 2.0
  anlamli_alan_orani: 0.25
  anlamli_alan_min_da: 2.0
  alan_birlesim: ve
  alan_kurali: bitisik
  bitisik_alan_min_da: 5.0
  yagis_penceresi_saat: 48
  yagis_esigi_mm: 1.0
  ani_baseline_sahne: 3
  art_arda_sahne: 2
  delta_yumusatma: 3

# Su ve sıcaklık dilimi (ADR 0017): hepsi ön değer
# Harita skalası (görselleştirme ilkesi 4): bahçe-içi aralık bu eşiğin altındaysa «kendi farkları» gerilmesi kapanır. Hepsi ön değer.
gorsel:
  durum: dogrulanmadi
  kaynak: >-
    Ön değer: sensör/işleme gürültüsünün üstünde fiziksel olarak anlamlı en küçük bahçe-içi aralık. NDVI/NDRE/NDMI/MSAVI ≈ 0,04–0,05 (Sentinel-2 yansıtma
    belirsizliği mertebesi), LAI 0,4, Landsat yüzey sıcaklığı 1,5 °C (100 m fiziksel çözünürlükte bahçe içi ayrıntı vermez), radar VH 1,5 dB (Lee sonrası
    kumlanma), radar değişimi radar.anlamli_degisim_db ile aynı, optik değişim 0,03. Ziraat mühendisi / uzaktan algılama uzmanı onayı bekliyor.
  gerilme_min_aralik:
    ndvi: 0.05
    ndre: 0.04
    ndmi: 0.05
    msavi: 0.05
    lai: 0.4
    yuzey_sicakligi: 1.5
    radar_vh: 1.5
    radar_degisim: 2.0
    degisim: 0.03

su:
  durum: dogrulanmadi
  kaynak: >-
    Ön değer · mühendis onayı bekliyor: Kc, NDVI 0,30→0,80 aralığında 0,45→0,75 (narenciye, doğrusal); etkin kök derinliği 80 cm;
    tükenme oranı p = 0,5 (RAW/TAW); doluluk «nemli» ≥ %60, «kuru» ≤ %35 (AYNI DÖNEM normaline göre, ±15 gün, 2015–2025); günlük < 2 mm yağış su dengesinde sayılmaz;
    yüzey–hava farkı bahçenin aynı ay Landsat geçmişine göre p25–p75 bandıyla değerlendirilir (sabit eşik yok; aynı ayda ≥ 8 geçmiş sahne);
    karışık piksel |bahçe − tampon| ≥ 1,5 °C. Tarla kapasitesi ve solma noktası SoilGrids + Saxton & Rawls pedotransferinden (ön değer),
    ERA5 mutlak nemine uygulanmaz. Adım 14 toprak tahlili gelince değişecek.
  kc_ndvi_alt: 0.30
  kc_ndvi_ust: 0.80
  kc_alt: 0.45
  kc_ust: 0.75
  kok_derinligi_cm: 80
  tukenme_orani: 0.5
  gecmis_gun: 30
  tahmin_gun: 7
  klima_pencere_gun: 15
  kucuk_yagis_esigi_mm: 2
  klima_p_alt: 2
  klima_p_ust: 98
  normal_aralik_alt: 10
  normal_aralik_ust: 90
  klima_ilk_yil: 2015
  klima_son_yil: 2025
  kok_katman_agirliklari: [15, 35, 50, 0]  # kök dağılımı yüzdesi (0–7, 7–28, 28–100, 100–255 cm)
  doluluk_nemli_min: 60
  doluluk_kuru_max: 35
  sicaklik_normal_alt: 25
  sicaklik_normal_ust: 75
  sicaklik_belirgin_alt: 10
  sicaklik_belirgin_ust: 90
  sicaklik_min_sahne: 8
  karisik_piksel_c: 1.5
  landsat_gecis_saati: 11

# Durum v2 (ADR 0018): her bileşen bahçenin KENDİ dönem normuna göre; ortanca/MAD sapması, yalnız aşağı yön ceza. Hepsi ön değer · v2
durum_v2:
  durum: dogrulanmadi
  kaynak: >-
    Ön değer · v2: ağırlıklar Ağaç gücü %35 · Su %25 · Beslenme %20 · Ani değişim %10 · Isı %10; ceza 1 ölçekli MAD sapmasından başlar, 3'te sıfırlanır;
    aynı takvim ayında ≥ 12 geçmiş sahne; kök bölgesi doluluğu ≥ %40 ceza yok, ≤ %10 puan 0; ısı: aynı ay yüzey–hava bandının üstünde 3 °C'de puan 0;
    S2 15 gün, Landsat 30 gün üstü bayat (ağırlık diğerlerine dağıtılır, güven düşer). Kademe: ≥85 İyi · 70–84 İzle · 50–69 Dikkat · <50 Sorun.
    Mühendis onayı bekliyor.
  w_agac_gucu: 0.35
  w_su: 0.25
  w_beslenme: 0.20
  w_ani_degisim: 0.10
  w_isi: 0.10
  z_tolerans: 1.0
  z_sifir: 3.0
  sigma_taban_ndvi: 0.03
  sigma_taban_ndmi: 0.03
  sigma_taban_ndre: 0.02
  asgari_ornek: 12
  doluluk_normal_min: 40
  doluluk_sifir: 10
  isi_sifir_c: 3.0
  bant_belirgin_alt: 10
  bant_normal_alt: 25
  bant_normal_ust: 75
  bant_belirgin_ust: 90
  ani_pencere_gun: 30
  ani_s2_puan: 40
  ani_radar_puan: 60
  ani_ikisi_puan: 30
  bayat_s2_gun: 15
  bayat_landsat_gun: 30
  min_toplam_agirlik: 0.40
  iyi_min: 85
  izle_min: 70
  dikkat_min: 50
  bilesen_normal_min: 90
  bilesen_belirgin_dusuk_max: 49

# Olay motoru (ADR 0018): kaynak eşikleri ve birleştirme. Hepsi ön değer
olay:
  durum: dogrulanmadi
  kaynak: >-
    Ön değer · mühendis onayı bekliyor: S2 ani düşüş = NDVI Δ ≥ 0,08 VE pikselin dönem (±15 gün, diğer yıllar) p10'unun altı, bitişik alan ≥ min(%25, 5 da), iki net görüntü ≤ 30 gün arayla; sonraki net görüntüde de sürmeli (aksi atmosfer şüphesi, olay değil); bahçenin >%90'ı düşüyorsa hava/radar ±5 gün desteği (ya da önceki 21 günde don) şart; don olayından sonra 0..+21 günde başlayabilen S2 düşüşü aynı olaya bağlanır (don + optik hasar izi); YALNIZ dona bağlı adaylar için ikinci yol «değişim anomalisi»: bahçe ortancası Δ'sı, diğer yılların aynı ±15 gün penceresindeki Δ dağılımının p10'unun altında (≥ 5 örnek) VE sonraki net görüntüde düşüşün ≥ yarısı sürüyor; en son sahnedeki düşüş «doğrulama bekliyor» (şüphe değil); radar yalnız güven=yüksek aday;
    don ≤ 0 °C (≤ −2 °C şiddetli); aşırı yağış 24 saatte ≥ 50 mm; kuvvetli rüzgâr hamle ≥ 60 km/s. ±5 gün içindeki sinyaller tek olay (en çok 10 gün yayılır);
    güven kaynak ailesi sayısı ve sinyal güveniyle artar. ERA5 31 km hamleyi olduğundan düşük gösterir: geçmiş hamle olayları güven=düşük.
  anomali_min_ornek: 5
  anomali_kalicilik_orani: 0.5
  s2_ndvi_dusus: 0.08
  s2_alan_orani: 0.25
  s2_alan_min_da: 5
  s2_yumusatma: 3
  s2_azami_aralik_gun: 30
  s2_pencere_gun: 15
  s2_normal_alt_yuzde: 10
  s2_min_ornek: 8
  s2_kalicilik_orani: 0.5
  s2_tum_bahce_orani: 0.90
  s2_destek_gun: 5
  don_hasar_gun: 21
  don_c: 0
  don_siddetli_c: -2
  yagis_24s_mm: 50
  hamle_kmh: 60
  birlestirme_gun: 5
  birlestirme_azami_sure_gun: 10
  guven_orta_puan: 2
  guven_yuksek_min: 4
  guven_orta_min: 2

# Bildirim karar katmanı (ADR 0018): ön değer
bildirim:
  durum: dogrulanmadi
  kaynak: >-
    Ön değer: kritik (don, şiddetli ya da çok kaynaklı yüksek güvenli olay, yüksek risk) anında; önemli (kademe düşüşü, orta risk, olay) ve bilgi günlük tek özette
    (07:00, yerel); sessiz saatler 22:00–07:00 (kritik hariç); bitişi 3 günden eski olay bildirilmez.
  ozet_saat: 7
  sessiz_baslangic: 22
  sessiz_bitis: 7
  taze_olay_gun: 3
  kritik_olay_guven: yuksek
  ozet_azami_madde: 8

# Kesintisiz canlılık eğrisi (ADR 0018): ön değer
egri:
  durum: dogrulanmadi
  kaynak: >-
    Ön değer: ağırlıklı Whittaker (λ = 300, ikinci fark); Sentinel-2 ağırlığı 1,0, HLS 0,6 (× geçerli piksel oranı); bant = %90 yaklaşık, en yakın gözleme uzaklıkla genişler;
    boşluk > 12 gün ise radar değişim işareti; kademe eğriye değil GERÇEK gözleme dayanır. Radar NDVI üretmez.
  lambda: 300
  w_s2: 1.0
  w_hls: 0.6
  hls_min_gecerli_oran: 0.5
  sigma_taban: 0.02
  belirsizlik_z: 1.645
  belirsizlik_tau_gun: 10
  gozlem_yakin_gun: 6
  ekstrapolasyon_azami_gun: 30
  radar_bosluk_gun: 12

# Geçmiş sayfası (9G): yıl özeti ve yeşerme başlangıcı — ön değer
gecmis:
  durum: dogrulanmadi
  kaynak: >-
    Ön değer · mühendis onayı bekliyor: yıl değeri = Haziran–Eylül aylık temsilci NDVI'larının ortalaması (en az 3 ay); yıl, DİĞER yılların dağılımına (≥ 5 yıl) göre
    tek etiket kuralıyla (p25–p75 normal · p10–p25 / p75–p90 altı/üstü · <p10 / >p90 belirgin) etiketlenir, sayı gösterilmez. Yeşerme başlangıcı: kış tabanı (Ocak–15 Şubat ortancası)
    ile ilkbahar tepesi (1 Mart–15 Haziran) arasındaki farkın %25'ini kalıcı (14 gün) aştığı ilk gün; genlik ≥ 0,05, ≥ 8 gerçek gözlem ve ≥ %60 gözlem destekli eğri yoksa HİÇ gösterilmez.
  yaz_ilk_ay: 6
  yaz_son_ay: 9
  yaz_asgari_ay: 3
  asgari_diger_yil: 5
  yesillenme_taban_son: "02-15"
  yesillenme_tepe_ilk: "03-01"
  yesillenme_tepe_son: "06-15"
  yesillenme_esik_orani: 0.25
  yesillenme_asgari_genlik: 0.05
  yesillenme_asgari_gozlem: 8
  yesillenme_gozlem_orani: 0.6
  yesillenme_kalicilik_gun: 14

# Saha Defteri (9G-B): doğruluk özeti ve saha turu — ön değer
saha:
  durum: dogrulanmadi
  kaynak: >-
    Ön değer · mühendis onayı bekliyor: bir olay türünde en az 5 çiftçi doğrulaması yoksa «henüz yeterli doğrulama yok» yazılır (oran verilmez); saha turu noktaları açık
    uyarılardan (zayıf kesim, stres yaması, doğrulama bekleyen olay) otomatik çıkar; stres yaması = son net görüntüde bahçenin kendi p10'unun altında bitişik ≥ 1 da ve alt %10'daki piksellerin yarısından çoğunu içeren küme (oran = stres_kume_orani);
    sıra en yakın komşu (yaklaşık, gerçek yürüyüş rotası değildir); süre 55 m/dk + nokta başına 4 dk.
  dogruluk_asgari_n: 5
  stres_yuzdelik: 10
  stres_min_da: 1.0
  stres_kume_orani: 0.5
  tur_hiz_m_dk: 55
  tur_nokta_dk: 4
  tur_azami_nokta: 12

# Olay doğrulamasında bağımsız dış kanıt (9G-E) — ön değer
dis_kanit:
  durum: dogrulanmadi
  kaynak: >-
    Ön değer · mühendis onayı bekliyor: kanıt YALNIZ olay motorundan bağımsız kaynaklardan gelir — Meteostat istasyon gözlemi (model/dolgu satırları hariç; bahçeye ≤ 80 km, en çok 3 istasyon)
    ve elle derlenmiş, URL'li kamu kayıtları (İl Tarım Müdürlüğü, TARSİM, yerel haber). ±1 gün pencerede: don için istasyon min ≤ 0 °C destekler, tüm gözlenenler ≥ 5 °C çelişir;
    aşırı yağış için günlük yağış ≥ 20 mm destekler, tüm gözlenenler ≤ 5 mm çelişir; arası ve veri yokluğu «kanıt yok». Rüzgâr, optik düşüş ve radar için istasyon kanıtı yoktur (yalnız kamu kaydı).
  pencere_gun: 1
  istasyon_azami_km: 80
  istasyon_sayisi: 3
  don_destek_c: 0.0
  don_celisme_c: 5.0
  yagis_destek_mm: 20
  yagis_celisme_mm: 5
  katalog_pencere_gun: 2
  kiyi_rakim_azami_m: 50

