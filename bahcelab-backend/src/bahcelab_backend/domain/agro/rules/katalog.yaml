# ADIM 10 (ADR 0031) — gece don riski. Tüm sayılar ön değer · mühendis onayı bekliyor. Doğrulama: docs/agro/don-dogrulama.md (§1–§6), kural seçimi: docs/agro/don-dilim0/kural-secimi.json
don:
  durum: dogrulanmadi
  kaynak: >-
    Ön değer · mühendis onayı bekliyor. Kritik sıcaklıklar (donma başlangıcı): UC ANR 8100 Tablo 2 (Geisel ve Unruh 2003) ve FAO Frost Protection Böl. 4 Tablo 4.10 (Puffer ve Turrell 1967);
    meyvede iki kaynaktan UYARI İÇİN DAHA TEMKİNLİ (yüksek) uç alınır. Yaprak ve odun: limona özgü sayısal kaynak yok → modelde YOK (mühendis girdisi bekleniyor). Süre: iki kaynak çelişir
    (UC: nem/süre etkili; FAO: 2–24 sa için süreden bağımsız) → uyarı için kısa süre yeter (≥ 1 saat eşik altı = tek saatlik minimum), süre eşiği DEĞİŞTİRMEZ. Tahmin: Open-Meteo, 3 model, EN SOĞUK model;
    sapma düzeltmesi YOK (benzer kıyı istasyonlarında tutarlı yön yok). σ = Akdeniz kıyısı en-soğuk-model RMSE'si. Kural A seçildi: kıyıda POD 0,846 (33/39) / FAR 0,64; B ve C kıyıda POD'u düşürdü.
  surum: don-1
  modeller: [ecmwf_ifs025, icon_seamless, gfs_seamless]
  min_model_sayisi: 2
  izle_k: 3.0          # İzle (yalnız uygulama içi): en soğuk model ≤ kritik + 3 K
  uyari_kural: A       # Uyarı (18:00 bildirimi): en soğuk model ≤ kritik + uyari_k
  uyari_k: 2.0
  uzlasi_k: 3.0        # B/C için; A'da yalnız «kaç model uzlaştı» bilgisi
  acik_sakin_bulut_max: 40.0   # C için (seçilmedi; tahmin bulut/rüzgârı don gecelerini ayırt etmedi: ulusal POD 0,45)
  acik_sakin_ruzgar_max: 3.0
  sigma_c: 2.4
  kritik_c:
    cicek: -2.8
    yeni_meyve: -0.8
    yesil_meyve: -1.4
    olgun_meyve: -0.8
    yaprak: null   # kaynak yok: mühendis girdisi bekleniyor
    odun: null     # kaynak yok: mühendis girdisi bekleniyor
  evre_organ:      # evrenin en hassas organı (önceki sezon meyvesi ağaçta kaldıysa olgun meyve eşiği de geçerli olabilir: mühendis onayı)
    kis_dinlenme: [olgun_meyve]
    tomurcuklanma: [cicek]
    ciceklenme: [cicek]
    meyve_tutumu: [yeni_meyve]
    meyve_gelisimi: [yesil_meyve]
    olgunlasma: [olgun_meyve]
  rolyef_min_m: 10.0
  egim_min_der: 3.0
  dem_pencere_km: 5.0
  bildirim_kapisi: ic_pilot   # 18:00 bildirimi ve ertesi sabah sorusu: kapali | ic_pilot (yalnız INTERNAL_EMAILS kullanıcılarının bahçeleri; bu kış iç pilot) | acik. Açma kararı bahar sonunda pilot verisiyle
  konum_esik: {cukur_tpi1000_m: -10.0, sirt_tpi1000_m: 10.0, yamac_egim_der: 5.0}   # betimleyici sınıf (ön değer)
  uyari_saat: 18
  soru_saat: 8
  yeniden_degerlendirme_surum: don-yd-1
  beklenen_kiyi_far: 0.64   # ADR 0031 §2 (kural A, 2 kış, kıyı 39 don gecesi): iç kalite ekranındaki referans çizgisi
  beklenen_kiyi_pod: 0.846
  # «Ne yapmalı» (risk orta/yüksekse gösterilir). HER önlem kaynaklıdır; sayılar kaynaktan, uydurma yok. Genel literatürdür: bahçeye uygunluğu ziraat mühendisiyle doğrulanmalı.
  onlemler:
    - kod: ruzgar_makinesi
      ad: Rüzgâr makinesi (büyük fan)
      ne: "Sıcak ve soğuk hava katmanlarını karıştırarak yüzey sıcaklığını yükseltir; 1,5 m'deki ortalama sıcaklık ters dönme (inversiyon) şiddetinin yaklaşık 1/3'ü kadar artar."
      kosullar:
        - "Belirgin bir sıcaklık ters dönmesi (inversiyon) varken işe yarar; inversiyon ne kadar güçlüyse koruma o kadar iyidir."
        - "Genellikle hava sıcaklığı yaklaşık 0 °C'ye ulaşınca çalıştırılır; daha iyisi kritik hasar sıcaklığına ulaşırken çalışıyor olmasıdır. Meyve ıslaksa buz oluşmadan kurutmak için daha erken başlatılır."
        - "Kaynakta bir rüzgâr makinesi için 4–5 ha başına 75 kW gücün gerektiği belirtilir."
      uyarilar:
        - "Ters dönme yoksa ya da çok zayıfsa önerilmez."
        - "Rüzgâr yaklaşık 2,5 m/s (8 km/sa) üzerindeyse ya da aşırı soğumuş sis varsa önerilmez."
        - "Aşırı soğumuş sis pervane kanadında buzlanma yapıp kanat kırılmasına yol açabilir."
      kaynak: "FAO, Frost Protection (Snyder ve de Melo-Abreu 2005), Böl. 7 «Active protection methods» — Wind machines"
      url: "http://www.fao.org/4/y7223e/y7223e0d.htm"
    - kod: agac_alti_sulama
      ad: Ağaç altı (mikro) yağmurlama ile koruma
      ne: "Su, donarken ısı verir; ıslak yüzeyi 0 °C civarında tutar. Kaynaklarda ağaç altı sistemlerle yaklaşık 0,5–1,7 °C koruma bildirilir (≈ 2–3,6 m yüksekliğe kadar)."
      kosullar:
        - "Ağaç altı sistemlerde uygulama hızı 2,0–3,0 mm/sa; başladıktan sonra sıralama yapılmadan kesintisiz çalıştırılır."
        - "Hafif donda (en düşük > −2,0 °C) hatlar bir sıra atlayarak çalıştırılabilir."
        - "Genç narenciye gövdelerinde, ağaç başına 38–87 L/sa gövde mikro-yağmurlamasıyla −12 °C'lik bir gecede sulanan gövdeler kontrole göre 1,0–5,0 °C daha sıcak ölçülmüştür."
        - "Toprak 1–2 gün önceden nemlendirilir (aşağıdaki «Toprak nemi» maddesi)."
      uyarilar:
        - "Alt dalların ıslanmasından kaçının."
        - "Aynı çalışmada ağaç başına 38 L/sa ile bile gövde −2,5 °C'ye düşmüştür: koruma sınırlıdır."
        - "Su kesilirse ya da hız yetersizse hasar artabilir; sistemin güvenilir çalışması şarttır."
      kaynak: "FAO, Frost Protection (2005), Böl. 7 — Sprinklers: under-plant ve microsprinklers (Perry 1994; Evans 2000; Rieger, Davies ve Jackson 1986)"
      url: "http://www.fao.org/4/y7223e/y7223e0d.htm"
    - kod: agac_ustu_yagmurlama
      ad: Ağaç üstü yağmurlama (koşullar ve riskler)
      ne: "Uygulama hızı yeterli ve düzgünse ≈ −7 °C'ye yakın koruma sağlayabilir; ancak narenciyede nadiren kullanılır (genç limonlar hariç, onlar daha esnektir)."
      kosullar:
        - "Başlatma: yaş termometre sıcaklığı 0 °C'ye ulaşınca daha az risklidir; kapatma: rüzgârın geldiği yönde yaş termometre sıcaklığı kritik sıcaklığın üstüne çıkmadan kapatılmamalı."
        - "Dönüş süresi 60 sn'yi geçmemeli, 30 sn daha iyi. Gerekli hız (mm/sa; 30 sn / 60 sn dönüş) — rüzgâr 0–0,5 m/s: −1,7 °C için 2,0 / 2,5; −3,3 °C için 2,8 / 3,3; −5,0 °C için 3,8 / 4,3. Rüzgâr 0,9–1,4 m/s: −1,7 °C için 2,5 / 3,0; −3,3 °C için 3,3 / 3,8; −5,0 °C için 4,6 / 5,1."
      uyarilar:
        - "Rüzgârlı, buharlaşmanın yüksek olduğu koşullarda yetersiz hız daha çok zarar verebilir (buz süt beyazı «kırağı» görünümündeyse hız düşüktür)."
        - "Sistem arızalanırsa ciddi hasar olabilir; buz yükü dal kırılmasına yol açabilir; kötü drenajlı toprakta kök hastalığı riski vardır."
      kaynak: "FAO, Frost Protection (2005), Böl. 7 — Over-plant sprinklers (Tablo 7.7 ve 7.8)"
      url: "http://www.fao.org/4/y7223e/y7223e0d.htm"
    - kod: govde_sarma_ortu
      ad: Gövde sarma / örtü (genç ağaçlar)
      ne: "Genç, dona duyarlı ağaçların gövde ve dallarını yalıtkan malzemeyle sarmak; narenciyede PVC sera da kullanılabilir (kaynakta 3 yıla kadar dayanım belirtilir)."
      kosullar:
        - "Malzeme: palmiye yaprağı, mısır sapı, karton ya da cam elyafı; gövdeyi zeminden ana dallara kadar örtün."
        - "Yağışlı havada dıştaki plastik örtü yalıtımı kuru tutar."
      uyarilar:
        - "Tek başına plastik çok az koruma sağlar."
        - "Kaynaklar bu yöntemi genç ağaçlar için anar; yetişkin bahçede uygulanabilirliği kaynaklarda yoktur."
      kaynak: "UC ANR Yayın 8100 (Geisel ve Unruh 2003), «Frost Protection Measures»; FAO (2005) Böl. 6 — covers"
      url: "https://escholarship.org/uc/item/5hh528qp"
    - kod: toprak_nemi
      ad: Toprak nemi ve zemin
      ne: "Nemli, çıplak toprak ısıyı daha iyi depolar ve geceleyin daha fazla ısı yayar."
      kosullar:
        - "Toprağı donun beklendiği günden 1–2 gün önce ıslatın ki drenaj olsun; üst 0,3 m tarla kapasitesine yakın (nemli ama doygun olmayan) tutulur."
        - "Zemini mümkün olduğunca temiz tutun: çıplak nemli toprak, malç ya da yer örtüsüyle kaplı topraktan daha fazla ısı yayar."
      uyarilar:
        - "Doygun toprak ısıyı iyi depolamaz; fazla sulama yarar sağlamaz."
      kaynak: "FAO, Frost Protection (2005), Böl. 6 «Passive protection methods» — soil water content; UC ANR Yayın 8100 (2003)"
      url: "http://www.fao.org/4/y7223e/y7223e0c.htm"

# ADIM 10B — olası sebep ayrıştırma (ADR 0033): kural tabanlı, açıklanabilir; ML yok. Kanıt = lehte/aleyhte satırlar; puan yalnız SIRALAMA içindir (olasılık değil).
sebep:
  durum: dogrulanmadi
  kaynak: >-
    Ön değer · mühendis onayı bekliyor. Tüm ağırlık ve eşikler tasarım önsel değeridir (docs/agro/sebep-ayristirma.md §2); iki bahçe, tek bağımsız etiketle (Şubat 2025 don) geriye dönük sınandı,
    doğruluk ÖLÇÜLEMEDİ. Don hasarının geç görünmesi: UF/IFAS HS1275 ve CH004 (belirtiler haftalar–aylar içinde belirir; dal ölümü iki yıla dek sürebilir). Besin/hastalık/mekanik için doğrudan uydu kanıtı
    yoktur: bunlar seçilemez, yalnız «sahada kontrol edin» listesidir.
  surum: sebep-1
  siralanan: [don, su, goruntu]
  bagimsiz_carpan: 1.5
  secim_esik: 2.0
  secim_marj: 0.5
  kapi_esik: 2.0
  kapi_don_azami: 1.0
  bulut_pct: 20
  tum_bahce_pay: 0.8
  toparlanma_orani: 0.6
  z_kurak: -1.0
  z_nemli: 0.5
  ndmi_dusus: -0.05
  don_c_guclu: -2.0
  don_c_sinir: 2.0
  don_c_imkansiz: 2.0
  yaz_aylari: [6, 7, 8, 9]
  kis_aylari: [12, 1, 2, 3, 4]
  kararlilik_deneme: 200
  kararlilik_min: 0.5
  kararlilik_aralik: 0.3
  agirlik:
    don_kullanici_oldu: 3.0
    don_istasyon_destek: 3.0
    don_dis_kayit_destek: 2.0
    don_era5_guclu: 3.0
    don_era5_sifir: 2.0
    don_era5_sinir: 0.5
    don_kis_kalici: 0.5
    don_kullanici_olmadi: -3.0
    don_istasyon_celisme: -3.0
    don_era5_imkansiz: -3.0
    su_toprak_kurak: 1.5
    su_ndmi_dusus: 1.0
    su_yaz: 0.5
    su_toprak_nemli: -1.0
    su_ndmi_yok: -1.0
    gor_toparlandi: 2.0
    gor_bulut: 1.0
    gor_tum_bahce: 1.0
    gor_kalici: -1.5
    gor_radar_degisim: -1.0
  kontrol_listesi:
    don:
      - metin: "Yaprakta koyu, sulu görünümlü alanlar; ölen yaprakta ağarma/kahverengileşme; genç sürgünde kararma."
        kaynak: "UF/IFAS HS1275 (Zekri ve ark.), «Freeze Damage Symptoms and Recovery for Citrus»"
        url: "https://ask.ifas.ufl.edu/publication/HS1275"
      - metin: "Dal kabuğunu hafifçe kazıyın: yeşil doku çoğunlukla canlı odundur, kahverengi doku donla ölmüş odundur. Yapraklar birkaç günde dökülürse odun büyük olasılıkla ölmemiştir; yapraklar dalda kuruyup kalıyorsa odun ölmüş olabilir."
        kaynak: "UF/IFAS HS1275"
        url: "https://ask.ifas.ufl.edu/publication/HS1275"
      - metin: "Hasar hemen belli olmayabilir: dal ölümü aylarca, bazen iki yıla kadar sürebilir; budamayı acele etmeyin."
        kaynak: "UF/IFAS CH004 (Recovering from Freeze Damage)"
        url: "https://ask.ifas.ufl.edu/publication/CH004"
    su:
      - metin: "Damlatıcı/mikro-yağmurlama çıkışları ve hat basıncı; düşüşün sulama bloğu sınırına uyup uymadığı."
      - metin: "Birkaç yerde 20–30 cm derinlikte toprak nemi (elle ya da probla); yaprakta solgunluk."
    besin:
      - metin: "Belirtilerin yaprakta ve ağaçta dağılımı; HLB ile karışabilen belirtiler için UF/IFAS rehberine bakın ve şüphede yaprak/toprak analizi yaptırın."
        kaynak: "UF/IFAS PP328 (Vashisth ve ark.), «HLB and Nutrient Deficiency Identification»"
        url: "https://ask.ifas.ufl.edu/publication/PP328"
    hastalik:
      - metin: "Düşüşün bir odaktan komşu ağaçlara doğru genişleyip genişlemediği; yaprak, meyve ve sürgünde leke/ben, kabuk ya da sakız akıntısı; yaprak altında böcek."
      - metin: "Şüphede HLB ve besin eksikliği belirtilerini ayırt etmek için UF/IFAS rehberi; kesin tanı için il/ilçe tarım müdürlüğü."
        kaynak: "UF/IFAS PP328"
        url: "https://ask.ifas.ufl.edu/publication/PP328"
    mekanik:
      - metin: "Düşen alanda budama, söküm, hasat, ilaçlama, ağır araç geçişi ya da toprak işleme kaydı var mı; alanın kenarı düz/keskin mi?"
    goruntu:
      - metin: "Sonraki net Sentinel-2 geçişini bekleyin; bulut gölgesi/ince bulut/sis düşüşü gösterip sonraki görüntüde kaybolabilir."
        kaynak: "Sentinel-2 SCL sınıfları, arXiv 2406.18584"
        url: "https://arxiv.org/html/2406.18584v2"

# ADIM 11 — Günlük (ADR 0034): gözlem etiketleri, hasat sözlüğü, fotoğraf ve çevrimdışı kuyruk. Hepsi ön değer · mühendis onayı bekliyor
gunluk:
  durum: dogrulanmadi
  kaynak: >-
    Ön değer · mühendis onayı bekliyor. Etiket kümesi ve kalite/satış sözlüğü ürün sahibinin kararıdır (ADR 0034); zararlı/hastalık adları ziraat mühendisi tarafından doğrulanacak.
    Kalite sınıfları: UNECE FFV-14 (turunçgil) «Extra / Class I / Class II» sınıfları (ECE/TRADE/C/WP.7/2009/5 metni okundu; güncel baskı doğrulanamadı) ile BİREBİR eşleşmez:
    «ihracatlik» bir ticari hedef sınıfıdır, «sanayilik_iskarta» standardın asgari gereklerini karşılamayan mahsuldür. Türk Standardı (TS) karşılığı bu oturumda doğrulanamadı.
  surum: gunluk-1
  gozlem_kategorileri:
    - kod: zararli
      ad: Zararlı
      etiketler:
        - {kod: akdeniz_meyve_sinegi, ad: Akdeniz meyve sineği}
        - {kod: kirmizi_orumcek, ad: Kırmızı örümcek}
        - {kod: unlu_bit, ad: Unlu bit}
        - {kod: kabuklu_bit, ad: Kabuklu bit}
        - {kod: beyaz_sinek, ad: Beyaz sinek}
        - {kod: yaprak_galeri_guvesi, ad: Yaprak galeri güvesi}
        - {kod: thrips, ad: Thrips}
        - {kod: yaprak_biti, ad: Yaprak biti}
        - {kod: diger, ad: Diğer}
    - kod: hastalik
      ad: Hastalık
      etiketler:
        - {kod: uckurutan, ad: Uçkurutan}
        - {kod: kahverengi_curukluk, ad: Kahverengi çürüklük / Phytophthora}
        - {kod: kok_bogazi_curuklugu, ad: Kök boğazı çürüklüğü}
        - {kod: antraknoz, ad: Antraknoz}
        - {kod: diger, ad: Diğer}
    - kod: fenoloji
      siddet_zorunlu: false
      ad: Fenoloji
      etiketler:
        - {kod: surgun, ad: Sürgün}
        - {kod: cicek, ad: Çiçek}
        - {kod: meyve_tutumu, ad: Meyve tutumu}
        - {kod: meyve_buyumesi, ad: Meyve büyümesi}
        - {kod: renk_donumu, ad: Renk dönümü}
        - {kod: hasat_olgunlugu, ad: Hasat olgunluğu}
    - kod: cevre
      ad: Çevre / fizyolojik
      etiketler:
        - {kod: don, ad: Don}
        - {kod: dolu, ad: Dolu}
        - {kod: ruzgar, ad: Rüzgâr}
        - {kod: gunes_yanigi, ad: Güneş yanığı}
        - {kod: yaprak_sararmasi, ad: Yaprak sararması (besin belirtisi olabilir)}
        - {kod: su_stresi, ad: Su stresi (solgunluk)}
    - kod: sulama_altyapi
      ad: Sulama / altyapı
      etiketler:
        - {kod: tikali_damlatici, ad: Tıkalı damlatıcı}
        - {kod: sizinti, ad: Sızıntı}
        - {kod: pompa_vana_arizasi, ad: Pompa / vana arızası}
    - kod: bakim
      siddet_zorunlu: false
      ad: Bakım / yönetim
      etiketler:      # ileride ilaçlama ve gübreleme de buraya girecek
        - {kod: budama, ad: Budama}
        - {kod: hasat, ad: Hasat}
        - {kod: budama_hasat, ad: Budama / hasat (ayrıştırılmamış)}
    - kod: genel
      siddet_zorunlu: false
      ad: Genel
      etiketler:
        - {kod: genel, ad: Genel gözlem}
  siddet:
    - {kod: az, ad: Az}
    - {kod: orta, ad: Orta}
    - {kod: cok, ad: Çok}
  yayginlik:
    - {kod: tek_agac, ad: Tek ağaç}
    - {kod: birkac_agac, ad: Birkaç ağaç}
    - {kod: bolge, ad: Bölge}
    - {kod: bahce_geneli, ad: Bahçe geneli}
  hasat:
    kasa_kg_varsayilan: 20
    kasa_kg_min: 5
    kasa_kg_max: 40
    miktar_kaynaklari:
      - {kod: kantar, ad: Kantar fişi (kg)}
      - {kod: kasa_tahmini, ad: Kasa adedi × kasa ağırlığı (tahmin)}
    kalite:
      - {kod: ihracatlik, ad: İhracatlık, unece: "Ticari hedef sınıfı; UNECE sınıfı değil (en az Class I + alıcı/ihracat şartnamesi, ön değer)"}
      - {kod: birinci_sinif, ad: Birinci sınıf, unece: "Class I"}
      - {kod: ikinci_sinif, ad: İkinci sınıf, unece: "Class II"}
      - {kod: sanayilik_iskarta, ad: Sanayilik / ıskarta, unece: "Karşılığı yok (Class II asgari gereklerini karşılamayan mahsul)"}
    satis_sekilleri:
      - {kod: dalinda_goturu, ad: Dalında götürü}
      - {kod: tuccara_kg, ad: Tüccara (kg)}
      - {kod: hale, ad: Hal}
      - {kod: kendi_depoya, ad: Kendi depoma}
      - {kod: ihracatciya, ad: İhracatçıya}
    toplam_tolerans_yuzde: 1
  foto:
    uzun_kenar_px: 2048
    hedef_bayt: 1000000
    roller: [genel, kantar_fisi]
  kuyruk:
    istek_zaman_asimi_sn: 30
    foto_zaman_asimi_sn: 60
    yeniden_deneme_bekleme_sn: [5, 30, 120, 600]
    en_cok_bekleyen: 200
  sistem_eslesme:
    sebep_yaniti:          # 10B «Sebep buydu» → gözlem etiketi (karşılığı olmayanlar None; ADR 0034 §5)
      don: cevre.don
      su: cevre.su_stresi
      besin: cevre.yaprak_sararmasi
      hastalik_zararli: hastalik.diger
      budama_hasat: bakim.budama_hasat
      bilmiyorum: null
    don_yaniti:            # ADIM 10 «Don oldu mu?»
      oldu: cevre.don
      olmadi: null
      bilmiyorum: null
