  sistem_programi:
    damla: {tetik_orani: 0.8, azami_net_mm: 8, en_az_net_mm: 3}
    mini_yagmurlama: {tetik_orani: 0.9, azami_net_mm: 20, en_az_net_mm: 8}
    salma: {tetik_orani: 1.0, azami_net_mm: 70, en_az_net_mm: 30}
  planlama_gun: 10
  sapma_bildirim_mm: 20
