# Zararlı / hastalık RİSK TAHMİNİ kuralları. Her kural ayrıdır, kaynak notlu ve "doğrulanmadı"dır.
# Çıktılar teşhis veya ilaç/uygulama tavsiyesi DEĞİL, hava koşullarından türetilen risk tahminidir; sahada kontrol esastır.
# Tuzak sayımı (Adım 12) bu kurallara `tuzak_esikleri` ile bağlanacak (arayüz hazır, değer yok).
surum: 1

kurallar:
  akdeniz_meyve_sinegi:
    ad: "Akdeniz meyve sineği"
    kisa: "Meyve sineği riski"
    urunler: [limon, portakal, mandalina, greyfurt]
    durum: dogrulanmadi
    kaynak: >-
      Gün-derece (GDD) birikimine dayalı genel bölgesel uyarı yaklaşımı (Ceratitis capitata). Taban sıcaklık ve nesil eşikleri
      yayınlarda farklı verilir; buradaki değerler ön değerdir ve ilçe tarım müdürlüğü uyarılarıyla doğrulanmalıdır.
    parametreler:
      gdd_taban_c: 10.0
      birikim_baslangic: "03-01"      # AA-GG: bu tarihten itibaren günlük GDD toplanır
      nesil_gdd: 400.0                 # bir kuşak (döngü) için gereken GDD; dolunca sayaç SIFIRLANIR, sonraki kuşak sayılır
      yeni_kusak_yakin_orani: 0.8      # döngünün bu oranından sonra "yeni kuşak çıkışı yaklaşıyor" notu
      aktivite_pencere_gun: 10         # seviye son 10 günün aktivite koşullarına bağlıdır
      aktif_sicaklik_min_c: 16.0       # günlük ortalama bu aralıktaysa gün "aktif" sayılır
      aktif_sicaklik_max_c: 32.0
      aktif_gun_orani: 0.7             # pencerenin en az bu oranı aktif olmalı
      duyarli_evreler: [meyve_gelisimi, olgunlasma]   # seviye yalnızca meyvenin duyarlı olduğu evrelerde "orta" olur
      # Tuzak sayımı yoksa en fazla "orta – tuzak kontrolü önerilir". "yüksek" YALNIZCA tuzak verisi eşiği aşınca (Adım 12 bağlar).
      tuzak_esikleri: {orta: 2.0, yuksek: 5.0}   # tuzak başına haftalık yakalanan adet (ön değer)
  kirmizi_orumcek:
    ad: "Kırmızı örümcek"
    kisa: "Kırmızı örümcek riski"
    urunler: [limon, portakal, mandalina, greyfurt]
    durum: dogrulanmadi
    kaynak: >-
      Sıcak ve kuru günlerin art arda sürmesinin akar popülasyonunu hızlandırdığı yönünde genel gözlem; eşikler ön değerdir,
      yerel gözlemle doğrulanmalıdır.
    parametreler:
      tmax_esik_c: 30.0               # günün en yüksek sıcaklığı bu değer ve üstü ise "sıcak gün"
      yagis_esik_mm: 1.0              # günlük yağış bu değerin altındaysa "kuru gün"
      nem_esik_yuzde: 50.0            # günlük ortalama nem bu değerin altındaysa (nem bilinen tahmin günlerinde) "kuru"
      orta_gun: 4                      # art arda sıcak+kuru gün sayısı
      yuksek_gun: 7
      geriye_bakis_gun: 7              # geçmişten bu kadar gün + tahmin günleri değerlendirilir
  kuruma_hastaligi:
    ad: "Kuruma hastalığı (mal secco)"
    kisa: "Kuruma hastalığı enfeksiyon riski"
    urunler: [limon]
    durum: dogrulanmadi
    kaynak: >-
      Mal secco (Phoma tracheiphila) enfeksiyonlarının yağmur, rüzgâr ve ılık sıcaklıkta yaralı dokulara bulaşma olasılığının
      arttığı yönündeki genel bilgi. Eşikler ön değerdir; yarım yaprak/yara durumu bilinmeden bir tahmin olarak okunmalıdır.
    parametreler:
      yagis_orta_mm: 5.0
      yagis_yuksek_mm: 10.0
      ruzgar_orta_kmh: 20.0
      ruzgar_yuksek_kmh: 30.0
      sicaklik_min_c: 14.0             # günlük ortalama sıcaklık bu aralıktaysa "ılık"
      sicaklik_max_c: 28.0
      koruma_penceresi_gun: 3          # koşulların sağlandığı günden sonra risk penceresi bu kadar gün sürer
